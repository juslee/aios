name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      runs:
        description: "Boots in the QEMU boot soak job (1-60, 90 s each); push and pull_request runs boot 5"
        required: false
        default: 5
        type: number

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (fmt + clippy + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: aarch64-unknown-none, aarch64-unknown-uefi
          components: rust-src, llvm-tools, clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - run: just check

  build-release:
    name: Build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: aarch64-unknown-none, aarch64-unknown-uefi
          components: rust-src, llvm-tools
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - run: just build-release

  test:
    name: Test (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: aarch64-unknown-none, aarch64-unknown-uefi
          components: rust-src, llvm-tools
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - run: just test

  tools:
    name: Tools (host)
    # Host-only crate tools/ (package aios-tools, binary aios): fmt, clippy and
    # tests, including the docs-check parity goldens. The real-repository goldens
    # replay a pinned main commit, so the checkout needs full history. The same
    # history holds two deleted oracles: scripts/soak-qemu.sh at 212df62, which
    # the soak parity tests read, and scripts/docs/check.py, which the differential
    # test runs with CPython 3.14 from setup-python, whatever the image's own
    # python3 is: the test accepts only an interpreter on Unicode 16.0.0, the
    # version aios's \d matches (CPython 3.12 and 3.13, on Unicode 15.x, lack
    # 80 of its 760 digits).
    # AIOS_REQUIRE_CHECK_PY makes that test fail rather than skip if python3,
    # its Unicode version or the history is ever wrong or missing here.
    # Pinned: /bin/sh is dash on this image, so `sh -n` and `#!/bin/sh` in
    # tools/tests/shim.rs reject bashisms; under bash those tests still pass but
    # no longer prove the shim is POSIX. The shim tests build through the real
    # justfile `tools` recipe (with a fake cargo), so they need `just`.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: cargo fmt --check -p aios-tools
      - run: cargo clippy -p aios-tools --all-targets -- -D warnings
      - run: cargo test -p aios-tools
        env:
          AIOS_REQUIRE_CHECK_PY: "1"

  security:
    name: Security (audit + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: aarch64-unknown-none, aarch64-unknown-uefi
          components: rust-src, llvm-tools
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - name: Install cargo-audit and cargo-deny
        run: cargo install cargo-audit cargo-deny --locked
      - run: just audit
      - run: just deny

  miri:
    name: Miri (unsafe UB detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: aarch64-unknown-none, aarch64-unknown-uefi
          components: rust-src, llvm-tools, miri
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - run: just miri

  qemu-soak:
    name: QEMU boot soak (report-only)
    # Measures boot flakiness for the crash investigation (see `just soak`).
    # Report-only: crashes show up in the summary and artifacts, never block CI.
    # One soak per commit. A manual dispatch can soak a commit again, with
    # its runs input setting the number of boots; push and pull_request runs
    # boot 5. claude/** branches get it from their push run, so
    # their pull_request run skips it. Every other PR head (renovate/*, other
    # same-repo branches, forks) has no push run and is soaked on the
    # pull_request event.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !startsWith(github.head_ref, 'claude/')
    # A newer push to a branch or PR cancels its soak still running. On main
    # each commit has its own group and nothing is cancelled, so back-to-back
    # merges each keep their soak (and their CI run is not marked cancelled).
    # Each manual dispatch has a group of its own (its run id), so it neither
    # cancels nor is cancelled by a push soak or another dispatch on that ref.
    concurrency:
      group: qemu-soak-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || (github.ref == 'refs/heads/main' && github.sha || github.ref) }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    # Pinned: the QEMU and edk2 versions come from the runner image, and soak
    # results are only comparable across runs on the same image.
    runs-on: ubuntu-26.04
    continue-on-error: true
    # GitHub's job limit: the soak step's own limit at the 60-boot maximum
    # (110 min, see "Plan the soak") plus 20 min of setup, summary and upload.
    timeout-minutes: 130
    env:
      AIOS_EDK2_FW: /usr/share/qemu-efi-aarch64/QEMU_EFI.fd
      # The dispatch input reaches the scripts as an environment variable,
      # never as ${{ }} text inside a script. It is empty on push and
      # pull_request, which have no inputs.
      RUNS: ${{ inputs.runs }}
    steps:
      # Outside target/, which rust-cache saves and restores: the harness
      # refuses an output directory that is not new or empty.
      - name: Choose the soak output directory
        run: echo "SOAK_OUT=$RUNNER_TEMP/aios-soak" >> "$GITHUB_ENV"
      # Boots: the runs input, or 5 when there is none. Soak step limit, in
      # minutes: ceil(runs x (90 + 15) / 60) + 5, where 15 s per boot covers
      # the harness's per-boot work and QEMU's exit after the SIGTERM at the
      # time limit (up to 10 s before SIGKILL), and 5 min covers the warm
      # `just disk`. 5 boots get 14 min, 60 boots 110.
      - name: Plan the soak
        id: plan
        run: |
          runs=${RUNS:-5}
          # Whole numbers only, leading zeros dropped (bash would read 030
          # as octal), and at most 2 digits before any arithmetic.
          case "$runs" in
            *[!0-9]*) echo "::error::runs must be a whole number (got '$runs')"; exit 1 ;;
          esac
          digits=${runs#"${runs%%[!0]*}"}
          if [ "${#digits}" -gt 2 ]; then
            echo "::error::runs must be at most 60 (got $digits)"
            exit 1
          fi
          runs=$((10#$runs))
          if [ "$runs" -lt 1 ] || [ "$runs" -gt 60 ]; then
            echo "::error::runs must be from 1 to 60 (got $runs)"
            exit 1
          fi
          minutes=$(( (runs * (90 + 15) + 59) / 60 + 5 ))
          echo "Plan: $runs boots x (90 s + 15 s); soak step limit $minutes min"
          echo "runs=$runs" >> "$GITHUB_OUTPUT"
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: aarch64-unknown-none, aarch64-unknown-uefi
          components: rust-src, llvm-tools
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      # ipxe-qemu provides efi-virtio.rom, the option ROM virtio-blk-pci needs.
      - name: Install QEMU, edk2 firmware and mtools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-efi-aarch64 ipxe-qemu mtools
          qemu-system-aarch64 --version
          dpkg -L qemu-efi-aarch64 | grep -E '\.fd$'
          test -f "$AIOS_EDK2_FW"
      # just soak builds this checkout's aios binary and runs it; build it
      # first so a build failure shows as its own step, not inside the soak.
      - name: Build the host tools
        run: just tools
      # TCG on x86 is slower than on the arm64 dev hosts, hence 90 s per boot.
      - name: Soak (${{ steps.plan.outputs.runs }} boots x 90 s)
        timeout-minutes: ${{ fromJSON(steps.plan.outputs.minutes) }}
        env:
          SOAK_RUNS: ${{ steps.plan.outputs.runs }}
        run: just soak runs="$SOAK_RUNS" secs=90 report_only=1 out="$SOAK_OUT"
      - name: Publish summary
        if: always()
        run: |
          if [ -f "$SOAK_OUT/summary.md" ]; then
            cat "$SOAK_OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "QEMU soak produced no summary; see the job log." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload soak logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qemu-soak-logs
          path: ${{ env.SOAK_OUT }}
          if-no-files-found: warn
